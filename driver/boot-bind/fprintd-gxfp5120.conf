# fprintd sandbox drop-in for the GXFP5120 fingerprint sensor.
# Stock fprintd.service runs with a restricted DeviceAllow list that does not
# cover the /dev/spidev* or /dev/gpiochip* device classes, so the daemon
# cannot open the sensor without this. Installed by boot-bind/install.sh.
[Service]
DeviceAllow=/dev/spidev0.0 rw
DeviceAllow=/dev/gpiochip0 rw
